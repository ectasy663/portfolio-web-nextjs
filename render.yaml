services:
  - type: web
    name: portfolio-ai-api
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python download_model.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: CORS_ORIGINS
        value: "https://namansinghpanwar.in,https://www.namansinghpanwar.in"
      - key: MOCK_LLM
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.7"
