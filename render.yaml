services:
  - type: web
    name: portfolio-ai-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: CORS_ORIGINS
        value: "https://namansinghpanwar.in,https://www.namansinghpanwar.in"
      - key: MOCK_LLM
        value: "false"
